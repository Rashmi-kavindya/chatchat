<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR ChatBot</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    body {
      background: #e5ddd5;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    .chat-wrapper {
      max-width: 720px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 20px;
    }

    .chat-header {
      text-align: center;
      padding: 15px;
      font-size: 24px;
      background: #6d76f0;
      color: #fff;
      border-radius: 15px 15px 0 0;
    }

    .chat-box {
      flex-grow: 1;
      padding: 20px;
      background: #fafafa;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      margin: 10px 0;
    }

    .message-row.bot {
      justify-content: flex-start;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 15px;
      position: relative;
      font-size: 15px;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in-out;
    }

    .message.user {
      background-color: #b2ebf8;
      border-bottom-right-radius: 0;
    }

    .message.bot {
      background-color: #f8e98d;
      border-bottom-left-radius: 0;
    }

    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      margin: 0 8px;
    }

    .input-group {
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ccc;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<div class="chat-wrapper">
  <div class="chat-header">
    HR ChatBot Assistant
  </div>

  <div id="chat-box" class="chat-box"></div>

  <div class="input-group">
    <input type="text" id="user-input" class="form-control" placeholder="Type your message here...">
    <div class="input-group-append">
        <button class="btn btn-secondary" onclick="startVoiceTyping()" title="Voice Input">
            <i class="fas fa-microphone"></i>
        </button>
        <button class="btn btn-success" onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
  </div>
</div>

<!-- Include voice.js -->
<script src="/static/js/voice.js"></script>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<script>
  function sendMessage() {
    const input = document.getElementById("user-input");
    const message = input.value.trim();
    if (message === "") return;

    addMessage(message, "user");
    input.value = "";

    fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ message }),
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.response) {
          addMessage(data.response, "bot");
        }
      });
  }

  function addMessage(text, sender) {
    const chatBox = document.getElementById("chat-box");

    const messageRow = document.createElement("div");
    messageRow.classList.add("message-row", sender);

    const avatar = document.createElement("img");
    avatar.src = sender === "user"
      ? "https://images.rawpixel.com/image_png_social_square/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIyLTA0L3BmLWljb240LWppcjIwNjItcG9yLWwtam9iNzg4LnBuZw.png"
      : "https://cdn-icons-png.flaticon.com/512/4712/4712027.png";
    avatar.classList.add("avatar");

    const messageBubble = document.createElement("div");
    messageBubble.classList.add("message", sender);
    messageBubble.innerHTML = text;

    if (sender === "user") {
      messageRow.appendChild(messageBubble);
      messageRow.appendChild(avatar);
    } else {
      messageRow.appendChild(avatar);
      messageRow.appendChild(messageBubble);
    }

    chatBox.prepend(messageRow);
  }

  document.getElementById("user-input").addEventListener("keypress", function (e) {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
